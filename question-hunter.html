<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071B3A">
<title>POINTS | صائد الأسئلة — إدارة اللعبة</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial}body{margin:0;padding:16px;background:linear-gradient(135deg,#dbeafe,#e0e7ff);color:#172554;min-height:100vh}.wrap{max-width:1050px;margin:auto}.head,.card{background:#fff;border-radius:20px;padding:22px;margin:0 0 16px;box-shadow:0 7px 24px #17255414}.head{text-align:center}.head h1{margin:6px 0;color:#4338ca}.muted,.hint{color:#64748b;font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-weight:bold;font-size:14px;margin:10px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:white}textarea{resize:vertical;min-height:70px}input[type=radio]{width:20px;height:20px;accent-color:#4338ca}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:bold;font-size:15px;cursor:pointer}.primary{background:linear-gradient(135deg,#4338ca,#6366f1);color:#fff}.gold{background:linear-gradient(135deg,#ea580c,#f59e0b);color:#fff}.gray{background:#e2e8f0;color:#1e293b}.green{background:#16a34a;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.question{border:1px solid #bfdbfe;border-radius:15px;padding:16px;margin:13px 0;background:#f8fafc}.question h3{margin:0;color:#1e40af}.opt{display:grid;grid-template-columns:1fr 28px;gap:10px;align-items:center;margin:7px 0}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;margin:10px 0;white-space:pre-wrap}.error{background:#fef2f2;color:#991b1b}.success{background:#f0fdf4;color:#166534}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions>*{flex:1}.hide{display:none!important}@media(max-width:600px){body{padding:9px}.head,.card{padding:15px}.actions{display:grid;grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header class="head"><div style="font-size:45px">🎯</div><h1>صائد الأسئلة — Question Hunter</h1><div class="muted">أدخل خمسة أسئلة، والطالب يصوّب على الأهداف. عند إصابة الهدف يظهر سؤال من إعدادك.</div></header>
<section class="card" id="login">
<h2>تسجيل دخول المعلم</h2><label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button class="btn primary" id="loginBtn" style="width:100%;margin-top:12px">دخول</button><div id="loginMsg" class="notice hide"></div>
</section>
<main id="app" class="hide">
<section class="card"><div class="grid"><div><b id="userLabel"></b><div class="muted" id="roleLabel"></div></div><div class="actions"><button class="btn gray" id="logoutBtn">تسجيل الخروج</button><button class="btn gold" id="copyLinkBtn">نسخ رابط الطلاب</button></div></div>
<div class="grid"><div><label>الشعبة</label><select id="classId"></select></div><div><label>تاريخ اللعبة (توقيت قطر)</label><input id="dateKey" type="date"></div></div>
<div id="status" class="notice hide"></div></section>
<section class="card"><h2>إعداد لعبة جديدة</h2><div class="grid"><div><label>اسم اللعبة</label><input id="title" maxlength="100" value="صائد الأسئلة"></div><div><label>النقاط لكل إجابة صحيحة</label><input id="reward" type="number" min="1" max="20" value="5"></div></div>
<p class="hint">أدخل خمسة أسئلة بالضبط. لكل سؤال خياران إلى أربعة، وحدد الإجابة الصحيحة. سيظهر سؤال واحد فقط بعد إصابة الهدف.</p><div id="questions"></div>
<div class="grid"><label style="display:flex;align-items:center;gap:8px"><input id="active" type="checkbox" checked style="width:20px"> نشر اللعبة للطلاب</label></div>
<div class="actions"><button class="btn primary" id="saveBtn">💾 حفظ ونشر اللعبة</button><button class="btn gray" id="loadBtn">تحميل الإعدادات الحالية</button></div>
<div id="savedInfo" class="notice hide"></div></section>
</main></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCAeHOVGUpG7WcPcUh0XtBvmTwLGdcBCJE",authDomain:"school-points-qatar.firebaseapp.com",projectId:"school-points-qatar",storageBucket:"school-points-qatar.firebasestorage.app",messagingSenderId:"689880020347",appId:"1:689880020347:web:24305b6f89ac3448acb9de"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),functions=firebase.app().functions("us-central1");
const GLOBAL_ADMIN_UID="hwPgzTQbdfUJa45G2Wwc79ANNJE2";
const $=id=>document.getElementById(id);let activeSchoolId="",assignedClasses=[],isGlobalAdmin=false;
function qatarDate(){const p=new Intl.DateTimeFormat("en",{timeZone:"Asia/Qatar",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t)?.value||"";return g("year")+"-"+g("month")+"-"+g("day");}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function call(name,data){return functions.httpsCallable(name)(data).then(r=>r.data||{});}
function message(id,text,type="notice"){const e=$(id);e.className="notice "+(type==="error"?"error":type==="success"?"success":"");e.textContent=text;e.classList.remove("hide");}
function buildQuestions(data){$("questions").innerHTML="";for(let i=0;i<5;i++){const q=data?.[i]||{};const box=document.createElement("div");box.className="question";box.innerHTML='<h3>🎯 السؤال '+(i+1)+'</h3><label>نص السؤال (يفضل أن يكون باللغة الإنجليزية)</label><textarea id="prompt'+i+'" maxlength="300" placeholder="Choose the correct answer...">'+esc(q.prompt||"")+'</textarea><label>الاختيارات — حدد الدائرة أمام الإجابة الصحيحة</label>'+[0,1,2,3].map(j=>'<div class="opt"><input id="q'+i+'o'+j+'" maxlength="160" placeholder="الاختيار '+(j+1)+'" value="'+esc(q.options?.[j]?.text||"")+'"><input type="radio" name="correct'+i+'" value="'+String.fromCharCode(65+j)+'" '+(q.correctOptionId===String.fromCharCode(65+j)?"checked":"")+' aria-label="الإجابة الصحيحة"></div>').join("");$("questions").appendChild(box);}}
function formQuestions(){return Array.from({length:5},(_,i)=>({id:"q"+(i+1),prompt:$("prompt"+i).value.trim(),options:[0,1,2,3].map(j=>({id:String.fromCharCode(65+j),text:$("q"+i+"o"+j).value.trim()})).filter(x=>x.text),correctOptionId:document.querySelector('input[name="correct'+i+'"]:checked')?.value||""}));}
async function openApp(user){const snap=await db.collection("users").doc(user.uid).get();if(!snap.exists)throw Error("الحساب غير موجود.");const profile=snap.data()||{};if(profile.active!==true||profile.approved!==true)throw Error("الحساب غير نشط أو غير معتمد.");isGlobalAdmin=user.uid===GLOBAL_ADMIN_UID&&profile.role==="admin";let classes=[];if(isGlobalAdmin){activeSchoolId=String(profile.licenseId||profile.schoolId||"global").trim();classes=["السادس 2","السادس 4","السادس 6"];}else if(profile.role==="staff"){activeSchoolId=String(profile.schoolId||"").trim();classes=Array.isArray(profile.classIds)?profile.classIds.map(x=>String(x).trim()).filter(Boolean):[];if(!activeSchoolId||!classes.length)throw Error("لا توجد شعب مسندة إلى حسابك.");}else throw Error("إدارة اللعبة متاحة للمدير العام والمعلمين المعتمدين فقط.");assignedClasses=Array.from(new Set(classes));$("classId").innerHTML=assignedClasses.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");$("userLabel").textContent=user.email||"حساب POINTS";$("roleLabel").textContent=isGlobalAdmin?"المدير العام":"المعلم";$("dateKey").value=qatarDate();$("login").classList.add("hide");$("app").classList.remove("hide");await loadGame();}
async function loadGame(){const classId=$("classId").value,dateKey=$("dateKey").value;if(!classId||!dateKey)return;try{const r=await call("getQuestionHunterGameForTeacher",{classId,dateKey,schoolId:activeSchoolId});if(!r.success)throw Error("تعذر تحميل الإعدادات.");if(!r.found){buildQuestions();$("title").value="صائد الأسئلة";$("active").checked=true;$("savedInfo").classList.add("hide");return;}const g=r.game||{};buildQuestions(g.questions);$("title").value=g.title||"صائد الأسئلة";$("reward").value=g.rewardPoints||5;$("active").checked=g.active===true;const info="اللعبة محفوظة. بدأ "+Number(g.sessionsStarted||0)+" طالبًا اللعب بها."+ (Number(g.sessionsStarted||0)>0?" تم قفل تعديل الأسئلة حفاظًا على نزاهة المحاولات.":"");message("savedInfo",info,"success");$("saveBtn").disabled=Number(g.sessionsStarted||0)>0;document.querySelectorAll("#questions input,#questions textarea").forEach(x=>x.disabled=Number(g.sessionsStarted||0)>0);$("title").disabled=Number(g.sessionsStarted||0)>0;$("reward").disabled=Number(g.sessionsStarted||0)>0;}catch(e){message("status",e.message||"تعذر التحميل.","error");}}
async function saveGame(){const questions=formQuestions();const data={classId:$("classId").value,dateKey:$("dateKey").value,title:$("title").value.trim(),rewardPoints:Number($("reward").value),active:$("active").checked,questions,schoolId:activeSchoolId};$("saveBtn").disabled=true;try{const r=await call("saveQuestionHunterGame",data);if(!r.success)throw Error("لم يؤكد الخادم حفظ اللعبة.");message("status","✅ تم حفظ اللعبة ونشرها للشعبة المحددة. يمكن للطلاب فتح زر صائد الأسئلة في بوابة الطالب.","success");await loadGame();}catch(e){message("status",e.message||"تعذر حفظ اللعبة.","error");$("saveBtn").disabled=false;}}
$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);}catch(e){message("loginMsg",e.message||"تعذر الدخول.","error");}};
$("password").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click();};$("logoutBtn").onclick=()=>auth.signOut();$("classId").onchange=loadGame;$("dateKey").onchange=loadGame;$("loadBtn").onclick=loadGame;$("saveBtn").onclick=saveGame;
$("copyLinkBtn").onclick=()=>{const u="https://student.abuhazem.com/?hunter=1&schoolId="+encodeURIComponent(activeSchoolId);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u).then(()=>message("status","تم نسخ الرابط: "+u,"success")).catch(()=>prompt("انسخ الرابط",u));else prompt("انسخ الرابط",u);};
auth.onAuthStateChanged(async user=>{if(!user){$("login").classList.remove("hide");$("app").classList.add("hide");return;}try{await openApp(user);}catch(e){await auth.signOut();message("loginMsg",e.message||"الحساب غير مصرح له.","error");}});
buildQuestions();
</script></body></html>
