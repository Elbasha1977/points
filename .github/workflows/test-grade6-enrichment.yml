name: Validate Grade 6 Enrichment Worksheet

on:
  push:
    branches: [main]
    paths:
      - 'grade6-enrichment-data.js'
      - 'index.html'
      - '.github/workflows/test-grade6-enrichment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check question bank syntax and scoring
        run: |
          node --check grade6-enrichment-data.js
          node - <<'NODE'
          global.window = {};
          require('./grade6-enrichment-data.js');
          const data = window.buildGrade6EnrichmentWorkbookData();
          if (data.fields.length !== 128) throw new Error('Expected 128 questions, got ' + data.fields.length);
          if (data.maxScore !== 128) throw new Error('Expected 128 total marks, got ' + data.maxScore);
          if (Object.keys(data.answerKey).length < 100) throw new Error('Answer key is unexpectedly incomplete.');
          const classes = ['السادس 2','السادس 4','السادس 6'];
          if (new Set(classes).size !== 3) throw new Error('Class scope check failed.');
          console.log('Question bank OK:', data.fields.length, 'questions;', data.maxScore, 'marks;', Object.keys(data.answerKey).length, 'answer keys.');
          NODE
      - name: Check student portal inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.external=False; self.buf=[]; self.items=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='script':
                      self.active=True; self.external=any(k=='src' for k,v in attrs); self.buf=[]
              def handle_data(self, data):
                  if self.active and not self.external: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.active:
                      if not self.external and ''.join(self.buf).strip(): self.items.append(''.join(self.buf))
                      self.active=False; self.external=False; self.buf=[]
          p=Scripts(); p.feed(Path('index.html').read_text(encoding='utf-8'))
          for i,src in enumerate(p.items):
              Path('/tmp/student-script-%02d.js'%i).write_text(src,encoding='utf-8')
          print('Extracted',len(p.items),'inline script blocks.')
          PY
          for f in /tmp/student-script-*.js; do node --check "$f"; done
